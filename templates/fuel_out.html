{% extends "base.html" %}
{% block content %}

<h2>Fuel OUT</h2>

<style>
.fuel-box {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
}

.fuel-card {
    background: rgba(15,20,40,0.8);
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,255,255,0.3);
}
.fuel-card h3 {
    color: #00f3ff;
}
.fuel-card select,
.fuel-card input {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
}
</style>

<div class="fuel-box">

    <!-- PETROL OUT -->
    <form method="post" class="fuel-card">
        <h3>Petrol OUT</h3>
        <input type="date" name="date" required>

        <select name="vehicle" required>
            {% for v in vehicles %}
            <option value="{{ v.id }}">{{ v.vehicle_no }}</option>
            {% endfor %}
        </select>

        <input type="number" step="0.1" name="litres" placeholder="Litres" required>
        <input type="hidden" name="fuel" value="Petrol">
        <button class="btn">Issue Petrol</button>
    </form>

    <!-- DIESEL OUT -->
    <form method="post" class="fuel-card">
        <h3>Diesel OUT</h3>
        <input type="date" name="date" required>

        <select name="vehicle" required>
            {% for v in vehicles %}
            <option value="{{ v.id }}">{{ v.vehicle_no }}</option>
            {% endfor %}
        </select>

        <input type="number" step="0.1" name="litres" placeholder="Litres" required>
        <input type="hidden" name="fuel" value="Diesel">
        <button class="btn">Issue Diesel</button>
    </form>

    <!-- OIL OUT -->
    <form method="post" class="fuel-card">
        <h3>Oil OUT</h3>
        <input type="date" name="date" required>

        <select name="vehicle" required>
            {% for v in vehicles %}
            <option value="{{ v.id }}">{{ v.vehicle_no }}</option>
            {% endfor %}
        </select>

        <input type="number" step="0.1" name="litres" placeholder="Litres" required>
        <input type="hidden" name="fuel" value="Oil">
        <button class="btn">Issue Oil</button>
    </form>

</div>

{% endblock %}
